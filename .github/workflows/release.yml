name: Build & Release

# Tagging v* cuts a release: builds installers for macOS + Windows and uploads
# them (plus the auto-updater metadata) to a GitHub Release draft.
# Running it manually (workflow_dispatch) builds installers WITHOUT publishing,
# and attaches them as workflow artifacts — handy for testing the pipeline.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build installers (${{ matrix.platform }})
        env:
          # The default token can create/upload to releases (permissions: contents: write).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing identity yet — don't let electron-builder try to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # Publish to the GitHub Release only on a tag; otherwise just build.
        run: npx --no-install electron-builder --${{ matrix.platform }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      - name: Upload build artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: mult-console-${{ matrix.platform }}
          path: |
            dist-installers/*.dmg
            dist-installers/*.zip
            dist-installers/*.exe
            dist-installers/*.yml
            dist-installers/*.blockmap
          if-no-files-found: warn
